name: CI

on:
  push:
    branches:
      - develop
      - master
  pull_request:
    branches:
      - develop
      - master

jobs:
  ci:
    name: CI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run Windows CI script
        if: runner.os == 'Windows'
        shell: cmd
        run: call ci.bat

      - name: Run Linux and macOS CI script
        if: runner.os == 'Linux' || runner.os == 'macOS'
        shell: bash
        run: bash ci.sh
